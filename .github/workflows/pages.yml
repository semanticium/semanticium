# Publish this repository's site on GitHub Pages, built by Semanticium's engine.
# The same file in every published repository: the site is named after the repository.
#   a push to main      → the site is built and published (its version: the latest v* tag, if any)
#   a version tag (v*)  → the same, and the site's zip is attached to that version's Release, kept for good
name: Publish the site

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # ENGINE_TOKEN lives in this environment, open to main and to v* tags only.
    environment: engine
    steps:
      - uses: actions/checkout@v7
        with:
          path: data
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: semanticium/engine
          token: ${{ secrets.ENGINE_TOKEN }}
          path: engine
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.dx-cli
            ~/.cargo/registry
            ~/.local/share/dioxus
            engine/target
          key: engine-${{ hashFiles('engine/Cargo.lock', 'engine/Dockerfile', 'engine/tools/ci.sh') }}
      - run: engine/tools/ci.sh "$SITE" data
      - uses: actions/upload-pages-artifact@v5
        with:
          path: engine/dist/${{ env.SITE }}
      # A version: the site as a zip, for its Release.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          zip_name="$SITE-site-${GITHUB_REF_NAME#v}.zip"
          (cd "engine/dist/$SITE" && zip -qr "$GITHUB_WORKSPACE/$zip_name" .)
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: site-zip
          path: ${{ env.ZIP_NAME }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-zip
      # The Release of this tag, created if needed; its zip replaced if it was already there.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" ./*.zip --repo "$GITHUB_REPOSITORY" --clobber
